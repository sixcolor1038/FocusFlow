<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>FocusFlow 悬浮窗</title>
  <style>
    :root {
      --fg: #1A1A2E; --muted: #4A4A6A; --accent: #4D8CF7; --border: rgba(224,233,248,0.95);
    }
    body.dark {
      --fg: #E8EAEE; --muted: #9DB8F5; --accent: #5B9CF7; --border: rgba(43,50,70,0.95);
    }
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
      font-family: "Segoe UI", "Microsoft YaHei", "微软雅黑", sans-serif;
      cursor: grab;
    }
    body:active { cursor: grabbing; }
    .card {
      margin: 0;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-sizing: border-box;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    body.dark .card { background: rgba(30, 35, 49, 0.72); }
    .row { display: flex; align-items: center; gap: 2px; line-height: 1.35; }
    .lbl {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      width: 26px;
      flex: none;
    }
    .val { color: var(--fg); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .slash { color: var(--fg); font-size: 9px; font-weight: 700; }
    .cpm { color: var(--accent); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="card">
    <div class="row"><span class="lbl">活跃</span><span class="val" id="today">0</span></div>
    <div class="row"><span class="lbl">速度</span><span class="cpm" id="cpm">0</span><span class="slash">/</span><span class="val">分</span></div>
  </div>
  <script src="floating.js"></script>
</body>
</html>
