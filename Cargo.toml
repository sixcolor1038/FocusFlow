[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "desktop",
]

# 遗留的 egui 版 GUI（crates/app）：已由 desktop(Tauri) 取代，保留源码作参考。
# 从 workspace 排除，避免默认构建/全量 check 重复编译旧 GUI。
# 注意：作为独立 crate 构建需额外联网解析依赖（独立 Cargo.lock），
# 日常开发/打包不需要，建议以 desktop(Tauri) 为准。
exclude = [
    "crates/app",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# config (INI compatible with existing config.ini)
config = "0.14"

# date/time
chrono = { version = "0.4", features = ["serde"] }

# serialization
serde = { version = "1", features = ["derive"] }

# error handling
anyhow = "1"
thiserror = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
