[package]
name = "focusflow-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
winres = "0.1"

[dependencies]
focusflow-core = { path = "../core" }
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
serde.workspace = true
anyhow.workspace = true

# GUI: egui / eframe（即时模式，中文需捆绑字体）
eframe = { version = "0.36", features = ["default_fonts", "persistence", "wayland", "x11"] }
egui = "0.36"
egui_extras = "0.36"

# 系统托盘
tray-icon = "0.24"
muda = "0.19"

# 全局热键
global-hotkey = "0.8"

# Windows API（单实例互斥/置顶等）
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

# 图标解码（PNG -> RGBA，供托盘图标）
image = "0.25"
